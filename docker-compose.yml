services:

  client:
    build: ./client
    ports:
      - "80:80"
    depends_on:
      - api
    restart: unless-stopped

  api:
    build: .
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=3000
    env_file:
      - .env
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: patterns
      POSTGRES_USER: patterns
      POSTGRES_PASSWORD: patterns
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  pgdata:
